[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoprod"
version = "0.1.0"
description = "The Autonomous Invariant-Driven Production Runtime & SRE Substrate for Vibe-Coded AI Applications"
authors = [
    { name = "Ahmed Hassan", email = "ahmed.alaa.hassan25@gmail.com" }
]
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "typing_extensions>=4.8.0",
]

[project.scripts]
autoprod = "autoprod.cli:main"
